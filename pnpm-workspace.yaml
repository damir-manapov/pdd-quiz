allowBuilds:
  simple-git-hooks: true
auditConfig:
  # image-size <=2.0.2 DoS (GHSA-w3rx-r6r6-pgpr ICNS, GHSA-5p2g-fcmc-qvqq JXL/HEIF): transitive
  # via expo>metro; the fix is a major bump (2.0.3) Metro can't take. Build-only, not shipped.
  ignoreGhsas:
    - 'GHSA-w3rx-r6r6-pgpr'
    - 'GHSA-5p2g-fcmc-qvqq'
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.10'
  - '@biomejs/cli-darwin-arm64@2.5.10'
  - '@biomejs/cli-darwin-x64@2.5.10'
  - '@biomejs/cli-linux-arm64-musl@2.5.10'
  - '@biomejs/cli-linux-arm64@2.5.10'
  - '@biomejs/cli-linux-x64-musl@2.5.10'
  - '@biomejs/cli-linux-x64@2.5.10'
  - '@biomejs/cli-win32-arm64@2.5.10'
  - '@biomejs/cli-win32-x64@2.5.10'
  - '@expo/cli@57.0.18'
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/fingerprint@0.20.10'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-config@57.0.10'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/prebuild-config@57.0.14'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16
  - expo-sharing@57.0.15
  - expo-splash-screen@57.0.8
overrides:
  'uuid@<11.1.1': '>=11.1.1'
